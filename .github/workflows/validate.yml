# The manifest carries a sha256 per file, and `postman init` rejects a file whose
# bytes do not match. A stale manifest therefore does not fail loudly here - it
# fails on a user's machine, as a skill that silently falls back to the CLI's
# bundled copy. Checking it on every push is much cheaper than diagnosing that.
name: Validate

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manifest is in sync with the skill files
        run: node scripts/build-manifest.js --check

      - name: Manifests are valid JSON
        run: |
          for file in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" && echo "ok $file"
          done

      - name: Every skill has frontmatter Claude Code can load
        run: |
          status=0
          for skill in plugins/*/skills/*/SKILL.md; do
            head -1 "$skill" | grep -qx -- '---' || { echo "::error file=$skill::missing YAML frontmatter"; status=1; }
            grep -qE '^name:' "$skill" || { echo "::error file=$skill::frontmatter has no name"; status=1; }
            grep -qE '^description:' "$skill" || { echo "::error file=$skill::frontmatter has no description"; status=1; }
          done
          exit $status
